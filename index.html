<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow | Kanban Board</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <div class="container">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="logo">
                <i class="fa-solid fa-layer-group"></i>
                <h2>TaskFlow</h2>
            </div>

            <div class="menu">

                <p class="menu-title">MENU</p>

                <a href="#" class="menu-item active">
                    <i class="fa-solid fa-table-columns"></i>
                    <span>Kanban Board</span>
                </a>

                <a href="#" class="menu-item">
                    <i class="fa-solid fa-chart-pie"></i>
                    <span>Overview</span>
                </a>

            </div>

            <div class="sidebar-bottom">

                <button id="themeToggle" type="button">
                    <i class="fa-solid fa-moon"></i>
                    <span>Dark Mode</span>
                </button>

            </div>

        </aside>


        <!-- MAIN CONTENT -->
        <main class="main-content">

            <!-- HEADER -->
            <header class="header">

                <div>
                    <h1>My Workspace</h1>
                    <p>Manage your tasks and stay productive.</p>
                </div>

                <div class="header-right">
                    <span class="user-avatar">P</span>
                </div>

            </header>


            <!-- STATISTICS -->
            <section class="stats-container">

                <div class="stat-card">

                    <div class="stat-icon purple">
                        <i class="fa-solid fa-list-check"></i>
                    </div>

                    <div>
                        <p>Total Tasks</p>
                        <h2 id="totalTasks">0</h2>
                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-icon orange">
                        <i class="fa-solid fa-clock"></i>
                    </div>

                    <div>
                        <p>In Progress</p>
                        <h2 id="progressTasks">0</h2>
                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-icon green">
                        <i class="fa-solid fa-circle-check"></i>
                    </div>

                    <div>
                        <p>Completed</p>
                        <h2 id="completedTasks">0</h2>
                    </div>

                </div>

            </section>


            <!-- COMPLETION PROGRESS -->
            <section class="progress-section">

                <div class="progress-info">

                    <h3>Task Completion Progress</h3>

                    <span id="progressPercentage">0%</span>

                </div>

                <div class="progress-bar">

                    <div class="progress-fill" id="progressFill"></div>

                </div>

                <p id="progressText">0 out of 0 tasks completed</p>

            </section>


            <!-- TOOLBAR -->
            <section class="toolbar">

                <div class="search-box">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search tasks..."
                    >

                </div>


                <div class="toolbar-right">

                    <select id="priorityFilter">

                        <option value="all">All Priorities</option>

                        <option value="high">High Priority</option>

                        <option value="medium">Medium Priority</option>

                        <option value="low">Low Priority</option>

                    </select>


                    <button class="add-task-btn" id="openFormBtn">

                        <i class="fa-solid fa-plus"></i>

                        Add New Task

                    </button>

                </div>

            </section>


            <!-- KANBAN BOARD -->
            <section class="kanban-board">


                <!-- TO DO -->
                <div class="kanban-column" data-status="todo">

                    <div class="column-header">

                        <div class="column-title">

                            <span class="status-dot todo-dot"></span>

                            <h3>To Do</h3>

                            <span class="task-count" id="todoCount">0</span>

                        </div>

                    </div>

                    <div class="task-list" id="todoList"></div>

                </div>


                <!-- IN PROGRESS -->
                <div class="kanban-column" data-status="progress">

                    <div class="column-header">

                        <div class="column-title">

                            <span class="status-dot progress-dot"></span>

                            <h3>In Progress</h3>

                            <span class="task-count" id="progressCount">0</span>

                        </div>

                    </div>

                    <div class="task-list" id="progressList"></div>

                </div>


                <!-- DONE -->
                <div class="kanban-column" data-status="done">

                    <div class="column-header">

                        <div class="column-title">

                            <span class="status-dot done-dot"></span>

                            <h3>Done</h3>

                            <span class="task-count" id="doneCount">0</span>

                        </div>

                    </div>

                    <div class="task-list" id="doneList"></div>

                </div>


            </section>

        </main>

    </div>


    <!-- ADD / EDIT TASK MODAL -->
    <div class="modal" id="taskModal">

        <div class="modal-content">

            <div class="modal-header">

                <h2 id="modalTitle">Add New Task</h2>

                <button id="closeModalBtn" class="close-btn" type="button">

                    <i class="fa-solid fa-xmark"></i>

                </button>

            </div>


            <form id="taskForm">

                <input type="hidden" id="editTaskId">


                <label for="taskTitle">Task Title</label>

                <input
                    type="text"
                    id="taskTitle"
                    placeholder="Enter task title"
                    required
                >


                <label for="taskDescription">Description</label>

                <textarea
                    id="taskDescription"
                    placeholder="Enter task description"
                ></textarea>


                <label for="taskPriority">Priority</label>

                <select id="taskPriority">

                    <option value="low">Low</option>

                    <option value="medium" selected>Medium</option>

                    <option value="high">High</option>

                </select>


                <label for="taskDate">Due Date</label>

                <input
                    type="date"
                    id="taskDate"
                    required
                >


                <label for="taskStatus">Status</label>

                <select id="taskStatus">

                    <option value="todo">To Do</option>

                    <option value="progress">In Progress</option>

                    <option value="done">Done</option>

                </select>


                <div class="form-buttons">

                    <button
                        type="button"
                        id="cancelBtn"
                        class="cancel-btn"
                    >
                        Cancel
                    </button>

                    <button type="submit" class="save-btn">
                        Save Task
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
